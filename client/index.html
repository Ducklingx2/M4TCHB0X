<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4TCHB0X</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="game"></div>

    <div id="crosshair">
        <span></span>
        <span></span>
    </div>

    <div id="hud">
        <div class="brand">M4TCHB0X</div>

        <div class="status">
            <div class="status-dot"></div>
            <span id="connection-status">LOCAL</span>
        </div>
    </div>

    <div id="interaction">
        <div id="interaction-text">RIGHT CLICK</div>
    </div>

    <div id="message"></div>

    <div id="controls">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> MOVE</div>
        <div><kbd>SHIFT</kbd> SPRINT</div>
        <div><kbd>SPACE</kbd> JUMP</div>
        <div><kbd>RMB</kbd> USE ITEM</div>
        <div><kbd>R</kbd> LOAD</div>
        <div><kbd>G</kbd> SWITCH</div>
        <div><kbd>ESC</kbd> LOCK/RELEASE MOUSE</div>
    </div>

    <div id="hotbar">
    <div class="slot selected" data-slot="0">
        <span class="slot-number">1</span>

        <div class="item fist">
            <div class="finger"></div>
            <div class="finger"></div>
            <div class="finger"></div>
            <div class="finger"></div>
        </div>

        <span class="item-name">OPEN FIST</span>
    </div>

    <div class="slot" data-slot="1">
        <span class="slot-number">2</span>

        <div class="item sign-item">
            <div></div>
        </div>

        <span class="item-count">48</span>
        <span class="item-name">SIGNS</span>
    </div>

    <div class="slot" data-slot="2">
        <span class="slot-number">3</span>

        <div class="item dart-item"></div>

        <span class="item-count">1</span>
        <span class="item-name">DART</span>
    </div>

    <div class="slot" data-slot="3">
        <span class="slot-number">4</span>

        <div class="item gun-item">
            <div class="gun-barrel"></div>
            <div class="gun-body"></div>
            <div class="gun-grip"></div>
        </div>

        <span class="item-name">GUN</span>
    </div>

    <div class="slot" data-slot="4">
        <span class="slot-number">5</span>

        <div class="item axe-item">
            <div class="axe-head"></div>
            <div class="axe-handle"></div>
        </div>

        <span class="item-name">AXE</span>
    </div>

    <div class="slot empty" data-slot="5">
        <span class="slot-number">6</span>
    </div>

    <div class="slot empty" data-slot="6">
        <span class="slot-number">7</span>
    </div>

    <div class="slot empty" data-slot="7">
        <span class="slot-number">8</span>
    </div>

    <div class="slot empty" data-slot="8">
        <span class="slot-number">9</span>
    </div>
</div>
    
    <div id="start-screen">
        <div class="start-panel">
            <div class="logo-small">M4Ŧ₵HB0Ж</div>
            <h1>ENTER THE MATCHBOX</h1>
            <p>Seven Matches. One Spark.</p>

            <button id="start-button">ENTER GAME</button>

            <div class="start-note">
                CLICK TO LOCK MOUSE
            </div>
        </div>
    </div>

    <div id="interaction-popup">
        <div class="popup-line"></div>
        <span id="popup-text"></span>
    </div>

    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
    </script>
    
    <script type="module" src="./src/main.js"></script>
</body>
</html>
